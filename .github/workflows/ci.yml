name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit tests and coverage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit and integrity tests with coverage thresholds
        shell: bash
        run: |
          npm run test:coverage 2>&1 | tee coverage.txt
          {
            echo "### Core logic coverage (Node ${{ matrix.node }})"
            echo '```'
            grep -E 'file +\||core\.js|all files' coverage.txt
            echo '```'
            echo "Thresholds: lines ≥ 95%, branches ≥ 85%, functions ≥ 95%."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Physics Intelligence dataset is consistent
        run: npm run validate:data
      - name: Static site builds
        run: node scripts/build-site.mjs

  e2e:
    name: Browser tests (Chromium, desktop + mobile, accessibility, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
